<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;
const h=React.createElement;

function saveGame(game){try{localStorage.setItem('td_game_v2',JSON.stringify(game));}catch(e){}}
function loadGame(){try{const d=localStorage.getItem('td_game_v2');return d?JSON.parse(d):null;}catch(e){return null;}}
function saveSavedGames(list){try{localStorage.setItem('td_saves_v2',JSON.stringify(list));}catch(e){}}
function loadSavedGames(){try{const d=localStorage.getItem('td_saves_v2');return d?JSON.parse(d):[];}catch(e){return[];}}

function genId(){return Math.random().toString(36).substr(2,9);}

const COURT_COLORS=[
  {hex:'#4ade80',rgb:'74,222,128'}, // green
  {hex:'#3b82f6',rgb:'59,130,246'}, // blue
  {hex:'#f472b6',rgb:'244,114,182'}, // pink
  {hex:'#f59e0b',rgb:'245,158,11'}, // amber
  {hex:'#a855f7',rgb:'168,85,247'}, // purple
  {hex:'#22d3ee',rgb:'34,211,238'} // cyan
];
function courtColor(courtNum){
  return COURT_COLORS[(courtNum-1)%COURT_COLORS.length];
}

function buildRound(players,prevRounds,courts,mixMode){
  const slots=courts*4;

  // Match count per player
  const matchCount={};
  players.forEach(p=>{matchCount[p.id]=0;});
  prevRounds.forEach(r=>{
    r.matches.forEach(m=>{
      [m.t1p1,m.t1p2,m.t2p1,m.t2p2].forEach(id=>{if(id&&matchCount[id]!==undefined)matchCount[id]++;});
    });
  });

  // Idle weight: favour players who sat out recently
  const idleW={};
  players.forEach(p=>{idleW[p.id]=0;});
  prevRounds.forEach((r,ri)=>{r.idle.forEach(id=>{idleW[id]+=(ri+1);});});

  // Partner history
  const partnerH={};
  prevRounds.forEach(r=>{
    r.matches.forEach(m=>{
      [[m.t1p1,m.t1p2],[m.t2p1,m.t2p2]].forEach(([a,b])=>{
        if(a&&b){const k=[a,b].sort().join('-');partnerH[k]=(partnerH[k]||0)+1;}
      });
    });
  });

  // Priority sort: least matches first, then idle recency
  function byPriority(a,b){
    const dm=(matchCount[a.id]||0)-(matchCount[b.id]||0);
    return dm!==0?dm:(idleW[b.id]||0)-(idleW[a.id]||0);
  }

  function bestPartner(player,candidates){
    return candidates.slice().sort((a,b)=>{
      const ka=[player.id,a.id].sort().join('-');
      const kb=[player.id,b.id].sort().join('-');
      return (partnerH[ka]||0)-(partnerH[kb]||0);
    })[0];
  }

  const hasMix=(mixMode==='mixed'||mixMode==='most')
    &&players.some(p=>p.gender==='M')&&players.some(p=>p.gender==='F');

  // --- Step 1: select playing pool ---
  // Core rule: ecart max 1 match. Select the playingCount players with the
  // fewest matches, respecting the group-of-4 constraint.
  // Then, WITHIN that pool, arrange pairs to maximise mixity.

  const n=players.length;
  const maxPlaying=Math.min(slots,Math.floor(n/4)*4);
  const sorted=[...players].sort(byPriority);
  let playing=sorted.slice(0,maxPlaying);
  let idle=sorted.slice(maxPlaying);

  // --- Step 2: form pairs ---
  let pairs=[];

  if(!hasMix){
    const rem=[...playing];
    while(rem.length>=2){
      const p1=rem.shift();
      const best=bestPartner(p1,rem);
      rem.splice(rem.indexOf(best),1);
      pairs.push([p1,best]);
    }
  } else {
    // Mix mode: within the playing pool, maximise mixed pairs
    // while handling odd gender imbalances gracefully.
    const playM=playing.filter(p=>p.gender==='M');
    const playF=playing.filter(p=>p.gender==='F');

    // Form as many mixed pairs as possible
    const remM=[...playM],remF=[...playF];
    const mixedPairs=[];
    while(remM.length>0&&remF.length>0){
      const m=remM.shift();
      const best=bestPartner(m,remF);
      remF.splice(remF.indexOf(best),1);
      mixedPairs.push([m,best]);
    }

    // Leftover same-gender players
    const leftover=[...remM,...remF];

    // If odd leftover AND in 'most' mode: break last mixed pair, fold into same-gender
    if(leftover.length%2===1&&mixedPairs.length>0&&mixMode==='most'){
      const last=mixedPairs.pop();
      leftover.push(last[0],last[1]);
    }

    // Form same-gender pairs from leftover
    const sameRem=[...leftover];
    const samePairs=[];
    while(sameRem.length>=2){
      const p1=sameRem.shift();
      const best=bestPartner(p1,sameRem);
      sameRem.splice(sameRem.indexOf(best),1);
      samePairs.push([p1,best]);
    }
    // Any solo player left over moves to idle
    if(sameRem.length===1) idle.push(sameRem[0]);

    pairs=[...mixedPairs,...samePairs];
  }

  // Assign pairs to courts
  const matches=[];
  for(let i=0;i+1<pairs.length&&matches.length<courts;i+=2){
    const t1=pairs[i],t2=pairs[i+1];
    if(!t1||!t2)break;
    matches.push({
      id:genId(),court:matches.length+1,
      t1p1:t1[0].id,t1p2:t1[1].id,
      t2p1:t2[0].id,t2p2:t2[1].id,
      score1:'',score2:'',done:false
    });
  }

  // Players not assigned to a court go to idle
  const playingInMatches=new Set(matches.flatMap(m=>[m.t1p1,m.t1p2,m.t2p1,m.t2p2]));
  const extraIdle=playing.filter(p=>!playingInMatches.has(p.id));
  const finalIdle=[...idle,...extraIdle];

  return {id:genId(),matches,idle:finalIdle.map(p=>p.id)};
}

function computeStandings(players,rounds,bonusMode){
  const stats={};
  players.forEach(p=>{stats[p.id]={id:p.id,name:p.name,gender:p.gender,pts:0,wins:0,losses:0,matches:0,bonusEarned:0};});
  rounds.forEach(r=>{
    r.matches.forEach(m=>{
      if(!m.done)return;
      const s1=parseInt(m.score1)||0,s2=parseInt(m.score2)||0;
      if(s1===0&&s2===0)return;
      const total=s1+s2;
      const t1=[m.t1p1,m.t1p2],t2=[m.t2p1,m.t2p2];
      t1.forEach(id=>{if(!stats[id])return;
        stats[id].matches++;
        if(s1>s2){stats[id].wins++;stats[id].pts+=3;}
        else{stats[id].losses++;stats[id].pts+=1;
          if(bonusMode&&total>0&&s1/total>=0.4){stats[id].pts+=1;stats[id].bonusEarned++;}
        }
        if(bonusMode&&s1>s2&&total>0&&s2/total<=0.3){stats[id].pts+=1;stats[id].bonusEarned++;}
      });
      t2.forEach(id=>{if(!stats[id])return;
        stats[id].matches++;
        if(s2>s1){stats[id].wins++;stats[id].pts+=3;}
        else{stats[id].losses++;stats[id].pts+=1;
          if(bonusMode&&total>0&&s2/total>=0.4){stats[id].pts+=1;stats[id].bonusEarned++;}
        }
        if(bonusMode&&s2>s1&&total>0&&s1/total<=0.3){stats[id].pts+=1;stats[id].bonusEarned++;}
      });
    });
  });
  return Object.values(stats).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||a.losses-b.losses);
}

                h('div',null,
                  h('div',{style:{fontSize:14,fontWeight:700}},g.name),
                  h('div',{style:{fontSize:12,color:'var(--gray)',marginTop:3}},
                    (g.players?.length||0)+' joueurs · '+( g.rounds?.length||0)+' tours · '+g.courts+' terrains'
                  ),
                  h('div',{style:{fontSize:11,color:'var(--gray)',marginTop:2}},
                    g.savedAt?'Sauvé '+new Date(g.savedAt).toLocaleDateString('fr'):''
                  )
                ),
                h('span',{style:{color:'var(--green)',fontSize:22,marginLeft:8}},'›')
              ),
              h('button',{className:'delete-btn',style:{flexShrink:0},onClick:e=>{e.stopPropagation();deleteSave(g.id);}},'×')
            )),
          h('button',{className:'btn btn-ghost',style:{marginTop:16},onClick:()=>setShowLoad(false)},'Fermer')
        )
      )
    );
  }

  // ── SETUP ──
  if(screen==='setup'){
    return h('div',{className:'screen active'},
      h('div',{className:'header'},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
          h('button',{className:'btn-ghost btn',style:{width:'auto',padding:'8px 0'},onClick:()=>setScreen('home')},'← Retour'),
          h('div',{style:{fontSize:13,color:'var(--gray)'}},'Étape '+(setupStep+1)+' / 3')
        ),
        h('div',{className:'progress-bar',style:{marginTop:12}},
          h('div',{className:'progress-fill',style:{width:((setupStep+1)/3*100)+'%'}})
        )
      ),
      h('div',{className:'section',style:{flex:1}},
        // Step 0: Name + courts
        setupStep===0&&h('div',null,
          h('div',{className:'section-title'},'Informations générales'),
          h('div',{className:'input-group'},
            h('div',{className:'input-label'},'Nom de la session'),
            h('input',{className:'input',value:gameName,onChange:e=>setGameName(e.target.value),placeholder:'Ex: Tournoi club juin'})
          ),
          h('div',{className:'input-group'},
            h('div',{className:'input-label'},'Nombre de terrains disponibles'),
            h('div',{style:{display:'flex',gap:8}},
              [1,2,3,4,5,6].map(n=>h('button',{key:n,onClick:()=>setCourts(n),
                style:{flex:1,padding:'13px 0',borderRadius:10,border:'1.5px solid '+(courts===n?'var(--green-mid)':'rgba(255,255,255,0.1)'),background:courts===n?'rgba(74,222,128,0.15)':'var(--card2)',color:courts===n?'var(--green)':'var(--gray)',fontWeight:700,fontSize:16,cursor:'pointer',transition:'all 0.15s'}
              },n))
            )
          ),
          h('button',{className:'btn btn-primary',style:{marginTop:8},onClick:()=>setSetupStep(1)},'Suivant →')
        ),
        // Step 1: Players
        setupStep===1&&h('div',null,
          h('div',{className:'section-title'},'Inscrire les joueurs (minimum 4)'),
          h('div',{className:'card'},
            h('div',{className:'input-group',style:{marginBottom:10}},
              h('div',{className:'input-label'},'Prénom'),
              h('input',{className:'input',value:newName,onChange:e=>setNewName(e.target.value),
                placeholder:'Prénom du joueur',
                onKeyDown:e=>e.key==='Enter'&&addPlayer()})
            ),
            h('div',{className:'input-group',style:{marginBottom:12}},
              h('div',{className:'input-label'},'Genre'),
              h('div',{className:'gender-select'},
                h('button',{className:'gender-btn '+(newGender==='M'?'active-m':''),onClick:()=>setNewGender('M')},'♂ Homme'),
                h('button',{className:'gender-btn '+(newGender==='F'?'active-f':''),onClick:()=>setNewGender('F')},'♀ Femme')
              )
            ),
            h('button',{className:'btn btn-primary btn-sm',onClick:addPlayer,disabled:!newName.trim()},'+ Ajouter le joueur')
          ),
          players.length>0&&h('div',null,
            h('div',{className:'section-title',style:{marginTop:4}},players.length+' joueur'+(players.length>1?'s':'')+' inscrit'+(players.length>1?'s':'')),
            players.map(p=>h('div',{key:p.id,className:'player-item'},
              h('div',{className:'avatar '+(p.gender==='M'?'avatar-m':'avatar-f')},p.name[0].toUpperCase()),
              h('div',{style:{flex:1}},
                h('div',{className:'player-name'},p.name),
                h('div',{className:'player-gender'},p.gender==='M'?'Homme':'Femme')
              ),
              h('button',{className:'delete-btn',onClick:()=>removePlayer(p.id)},'×')
            ))
          ),
          h('div',{style:{display:'flex',gap:8,marginTop:12}},
            h('button',{className:'btn btn-secondary',style:{flex:'0 0 auto',width:'auto',padding:'14px 20px'},onClick:()=>setSetupStep(0)},'←'),
            h('button',{className:'btn btn-primary',style:{flex:1},disabled:players.length<4,onClick:()=>setSetupStep(2)},'Suivant → ('+players.length+' joueurs)')
          )
        ),
        // Step 2: Options
        setupStep===2&&h('div',null,
          h('div',{className:'section-title'},'Options de l\'animation'),
          players.some(p=>p.gender==='M')&&players.some(p=>p.gender==='F')&&h('div',{className:'card',style:{marginBottom:16}},
            h('div',{style:{fontSize:13,fontWeight:700,marginBottom:14,color:'#fff'}},'Composition des équipes mixtes'),
            [
              {v:'mixed',l:'Équipes mixtes',s:'1 homme + 1 femme par équipe'},
              {v:'most',l:'Mixte si possible',s:'Priorité au mixte, mais flexible'},
              {v:'none',l:'Libre',s:'Sans contrainte de genre'}
            ].map(o=>h('div',{key:o.v,onClick:()=>setMixMode(o.v),
              style:{display:'flex',alignItems:'center',gap:12,padding:'12px 10px',borderRadius:10,
                background:mixMode===o.v?'rgba(74,222,128,0.1)':'transparent',
                border:'1px solid '+(mixMode===o.v?'rgba(74,222,128,0.3)':'transparent'),
                cursor:'pointer',marginBottom:6,transition:'all 0.15s'}},
              h('div',{style:{width:20,height:20,borderRadius:'50%',border:'2px solid '+(mixMode===o.v?'var(--green)':'rgba(255,255,255,0.25)'),
                display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
                mixMode===o.v&&h('div',{style:{width:10,height:10,borderRadius:'50%',background:'var(--green)'}})
              ),
              h('div',null,
                h('div',{style:{fontSize:14,fontWeight:600,color:'#fff'}},o.l),
                h('div',{style:{fontSize:12,color:'var(--gray)',marginTop:2}},o.s)
              )
            ))
          ),
          h('div',{className:'card'},
            h('div',{style:{fontSize:13,fontWeight:700,marginBottom:12,color:'#fff'}},'Système de points bonus'),
            h('div',{className:'toggle-row'},
              h('div',null,
                h('div',{className:'toggle-label'},'Activer les points bonus'),
                h('div',{className:'toggle-sub'},'En plus de la victoire/défaite standard')
              ),
              h('button',{className:'toggle '+(bonusMode?'on':''),onClick:()=>setBonusMode(b=>!b)})
            ),
            bonusMode&&h('div',{style:{marginTop:14,padding:'12px',background:'var(--card2)',borderRadius:10}},
              h('div',{style:{fontSize:12,color:'var(--gray)',lineHeight:1.9}},
                h('span',{style:{color:'var(--green)',fontWeight:700}},'🏆 Victoire = 3 pts'),h('br',null),
                h('span',{style:{color:'var(--gray)'}},'Défaite = 1 pt'),h('br',null),
                h('span',{style:{color:'var(--gold)',fontWeight:600}},'⭐ Défaite serrée (≥ 40% des pts) = +1 bonus'),h('br',null),
                h('span',{style:{color:'var(--accent)',fontWeight:600}},'💪 Victoire écrasante (adv. ≤ 30%) = +1 bonus')
              )
            )
          ),
          h('div',{style:{display:'flex',gap:8,marginTop:12}},
            h('button',{className:'btn btn-secondary',style:{flex:'0 0 auto',width:'auto',padding:'14px 20px'},onClick:()=>setSetupStep(1)},'←'),
            h('button',{className:'btn btn-primary',style:{flex:1},onClick:launchGame},'🎾 Lancer l\'animation !')
          )
        )
      )
    );
  }

  // ── GAME ──
  if(screen==='game'){
    return h('div',{className:'screen active'},
      h('div',{className:'header'},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',paddingBottom:12,borderBottom:'1px solid rgba(255,255,255,0.06)'}},
          h('button',{className:'btn-ghost btn',style:{width:'auto',padding:'8px 0',fontSize:13},
            onClick:()=>{saveCurrentGame();setScreen('home');}},'← Accueil'),
          h('div',{style:{fontSize:13,fontWeight:700,color:'#fff',letterSpacing:-0.3}},game.name),
          h('button',{className:'btn btn-secondary btn-sm',style:{width:'auto',fontSize:12},onClick:saveCurrentGame},'💾')
        )
      ),
      h('div',{className:'section',style:{flex:1}},
        // TERRAINS TAB
        tab==='courts'&&h('div',null,
          h('div',{className:'stat-row'},
            h('div',{className:'stat-box'},
              h('div',{className:'stat-num'},game.rounds.length),
              h('div',{className:'stat-label'},'Tours joués')
            ),
            h('div',{className:'stat-box'},
              h('div',{className:'stat-num'},roundsDone),
              h('div',{className:'stat-label'},'Terminés')
            ),
            h('div',{className:'stat-box'},
              h('div',{className:'stat-num'},game.courts),
              h('div',{className:'stat-label'},'Terrains')
            )
          ),
          currentRound&&h('div',null,
            h('div',{className:'round-header'},
              h('div',{className:'round-num'},'Tour '+game.rounds.length),
              h('div',{className:'round-sub'},
                allDone?'✓ Tour terminé — lancez le suivant':
                (currentRound.matches.filter(m=>m.done).length)+'/'+currentRound.matches.length+' matchs terminés'
              )
            ),
            currentRound.matches.map(m=>
              h(MatchCard,{key:m.id,m,roundId:currentRound.id,pName,pGender,openNumPad,editScore,
                courtColorClass:'court-'+(((m.court-1)%6)+1)})
            ),
            currentRound.idle.length>0&&h('div',{className:'idle-player'},
              h('div',{className:'idle-title'},'⏸ En attente ce tour'),
              currentRound.idle.map(id=>h('div',{key:id,className:'idle-player-name'},
                h('div',{className:'avatar '+(pGender(id)==='M'?'avatar-m':'avatar-f'),style:{width:22,height:22,fontSize:9}},pName(id)[0]),
                pName(id)
              ))
            ),
            allDone&&h('button',{className:'btn btn-primary',style:{marginTop:20},onClick:nextRound},
              '▶ Lancer le tour '+(game.rounds.length+1)
            )
          )
        ),
        // CLASSEMENT TAB
        tab==='standings'&&h('div',null,
          h('div',{className:'section-title'},'Classement individuel'),
          game.bonusMode&&h('div',{className:'info-banner'},
            '🏆 Victoire = 3 pts · Défaite = 1 pt\n',h('br',null),
            '⭐ Défaite serrée (≥40%) = +1 · 💪 Victoire écrasante (≤30%) = +1'
          ),
          standings.length===0?
            h('div',{style:{color:'var(--gray)',fontSize:14,textAlign:'center',padding:'32px 0'}},'Les scores apparaîtront ici après le premier match.'):
            standings.map((s,i)=>h('div',{key:s.id,className:'rank-item'},
              h('div',{className:'rank-pos '+(i===0?'gold':i===1?'silver':i===2?'bronze':'')},i+1),
              h('div',{className:'avatar '+(s.gender==='M'?'avatar-m':'avatar-f'),style:{width:32,height:32,fontSize:13}},s.name[0]),
              h('div',{style:{flex:1}},
                h('div',{className:'rank-name'},s.name),
                h('div',{className:'rank-stats'},
                  h('span',{className:'badge badge-win'},s.wins+'V'),
                  ' ',
                  h('span',{className:'badge badge-loss'},s.losses+'D'),
                  ' ',s.matches+' match'+(s.matches>1?'s':''),
                  s.bonusEarned>0&&h('span',null,' · ',h('span',{style:{color:'var(--gold)'}},'+'+s.bonusEarned+' bonus'))
                )
              ),
              h('div',{style:{textAlign:'right'}},
                h('div',{className:'rank-pts'},s.pts),
                h('div',{className:'rank-pts-label'},'points')
              )
            ))
        ),
        // JOUEURS TAB
        tab==='players'&&h('div',null,
          h('div',{className:'section-title'},game.players.length+' joueurs inscrits'),
          game.players.map((p,idx)=>{
            const st=standings.find(s=>s.id===p.id)||{matches:0,pts:0,wins:0,losses:0};
            return h('div',{key:p.id,className:'player-item'},
              h('div',{className:'avatar '+(p.gender==='M'?'avatar-m':'avatar-f')},p.name[0]),
              h('div',{style:{flex:1}},
                h('div',{className:'player-name'},p.name),
                h('div',{className:'player-gender'},
                  p.gender==='M'?'Homme':'Femme',
                  ' · ',st.matches,' match'+(st.matches>1?'s':'')
                )
              ),
              h('div',{style:{textAlign:'right'}},
                h('div',{style:{fontSize:18,fontWeight:800,color:'var(--green)'}},st.pts,h('span',{style:{fontSize:11,color:'var(--gray)',fontWeight:400}},' pts')),
                h('div',{style:{fontSize:11,color:'var(--gray)'}},st.wins+'V '+st.losses+'D')
              )
            );
          })
        ),
        // HISTORIQUE TAB
        tab==='history'&&h('div',null,
          h('div',{className:'section-title'},'Historique des tours'),
          [...game.rounds].reverse().map((r,ridx)=>{
            const roundNum=game.rounds.length-ridx;
            const doneCount=r.matches.filter(m=>m.done).length;
            const isComplete=doneCount===r.matches.length;
            return h('div',{key:r.id,className:'card',style:{marginBottom:14}},
              h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}},
                h('div',{style:{fontSize:14,fontWeight:700,color:'#fff'}},'Tour '+roundNum),
                h('div',{className:'badge '+(isComplete?'badge-win':'badge-loss')},
                  isComplete?'✓ Complet':doneCount+'/'+r.matches.length+' fait'+(doneCount>1?'s':'')
                )
              ),
              r.matches.map(m=>
                h(HistoryRow,{key:m.id,m,pName,onEdit:()=>setEditingMatch({roundId:r.id,match:m})})
              ),
              r.idle.length>0&&h('div',{className:'idle-player'},
                h('div',{className:'idle-title'},'⏸ En attente ce tour'),
                r.idle.map(id=>h('div',{key:id,className:'idle-player-name'},
                  h('div',{className:'avatar '+(pGender(id)==='M'?'avatar-m':'avatar-f'),style:{width:20,height:20,fontSize:9}},pName(id)[0]),
                  pName(id)
                ))
              )
            );
          })
        ),
        // RÉGLAGES TAB
        tab==='settings'&&h('div',null,
          h('div',{className:'section-title'},'Réglages en cours de tournoi'),
          h('div',{className:'info-banner'},'Les modifications s\'appliquent dès le prochain tour généré.'),

          // Terrains
          h('div',{className:'card'},
            h('div',{style:{fontSize:13,fontWeight:700,marginBottom:12,color:'#fff'}},'Nombre de terrains'),
            h('div',{style:{display:'flex',gap:8}},
              [1,2,3,4,5,6].map(n=>h('button',{key:n,onClick:()=>{const u={...game,courts:n};setGame(u);saveGame(u);},
                style:{flex:1,padding:'13px 0',borderRadius:10,border:'1.5px solid '+(game.courts===n?'var(--green-mid)':'rgba(255,255,255,0.1)'),
                  background:game.courts===n?'rgba(74,222,128,0.15)':'var(--card2)',
                  color:game.courts===n?'var(--green)':'var(--gray)',fontWeight:700,fontSize:16,cursor:'pointer',transition:'all 0.15s'}
              },n))
            )
          ),

          // Mixité
          game.players.some(p=>p.gender==='M')&&game.players.some(p=>p.gender==='F')&&h('div',{className:'card'},
            h('div',{style:{fontSize:13,fontWeight:700,marginBottom:14,color:'#fff'}},'Composition des équipes'),
            [
              {v:'mixed',l:'Équipes mixtes',s:'1 homme + 1 femme par équipe'},
              {v:'most',l:'Mixte si possible',s:'Priorité au mixte, mais flexible'},
              {v:'none',l:'Libre',s:'Sans contrainte de genre'}
            ].map(o=>h('div',{key:o.v,onClick:()=>{const u={...game,mixMode:o.v};setGame(u);saveGame(u);},
              style:{display:'flex',alignItems:'center',gap:12,padding:'12px 10px',borderRadius:10,
                background:game.mixMode===o.v?'rgba(74,222,128,0.1)':'transparent',
                border:'1px solid '+(game.mixMode===o.v?'rgba(74,222,128,0.3)':'transparent'),
                cursor:'pointer',marginBottom:6,transition:'all 0.15s'}},
              h('div',{style:{width:20,height:20,borderRadius:'50%',border:'2px solid '+(game.mixMode===o.v?'var(--green)':'rgba(255,255,255,0.25)'),
                display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
                game.mixMode===o.v&&h('div',{style:{width:10,height:10,borderRadius:'50%',background:'var(--green)'}})
              ),
              h('div',null,
                h('div',{style:{fontSize:14,fontWeight:600,color:'#fff'}},o.l),
                h('div',{style:{fontSize:12,color:'var(--gray)',marginTop:2}},o.s)
              )
            ))
          ),

          // Bonus
          h('div',{className:'card'},
            h('div',{style:{fontSize:13,fontWeight:700,marginBottom:12,color:'#fff'}},'Points bonus'),
            h('div',{className:'toggle-row',style:{borderBottom:'none'}},
              h('div',null,
                h('div',{className:'toggle-label'},'Activer les bonus'),
                h('div',{className:'toggle-sub'},'Défaite serrée / Victoire écrasante')
              ),
              h('button',{className:'toggle '+(game.bonusMode?'on':''),onClick:()=>{const u={...game,bonusMode:!game.bonusMode};setGame(u);saveGame(u);}})
            ),
            game.bonusMode&&h('div',{style:{marginTop:12,padding:'12px',background:'var(--card2)',borderRadius:10}},
              h('div',{style:{fontSize:12,color:'var(--gray)',lineHeight:1.9}},
                h('span',{style:{color:'var(--green)',fontWeight:700}},'🏆 Victoire = 3 pts'),h('br',null),
                'Défaite = 1 pt',h('br',null),
                h('span',{style:{color:'var(--gold)',fontWeight:600}},'⭐ Défaite serrée (≥40%) = +1'),h('br',null),
                h('span',{style:{color:'var(--accent)',fontWeight:600}},'💪 Victoire écrasante (≤30%) = +1')
              )
            )
          ),

          // Ajouter un joueur
          h(AddPlayerPanel,{game,setGame}),

          // Liste joueurs avec suppression
          h('div',{className:'card'},
            h('div',{style:{fontSize:13,fontWeight:700,marginBottom:12,color:'#fff'}},game.players.length+' joueurs inscrits'),
            game.players.map(p=>{
              const st=standings.find(s=>s.id===p.id)||{matches:0};
              return h('div',{key:p.id,className:'player-item',style:{marginBottom:6}},
                h('div',{className:'avatar '+(p.gender==='M'?'avatar-m':'avatar-f')},p.name[0]),
                h('div',{style:{flex:1}},
                  h('div',{className:'player-name'},p.name),
                  h('div',{className:'player-gender'},p.gender==='M'?'Homme':'Femme',' · ',st.matches,' match'+(st.matches>1?'s':''))
                ),
                h('button',{className:'delete-btn',title:'Retirer ce joueur',
                  onClick:()=>{if(game.players.length<=4)return alert('Minimum 4 joueurs requis.');
                    const u={...game,players:game.players.filter(x=>x.id!==p.id)};setGame(u);saveGame(u);}
                },'×')
              );
            })
          ),

          h('div',{style:{height:8}})
        )
      ),
      // TAB BAR
      h('div',{className:'tab-bar'},
        [
          {id:'courts',icon:'🎾',label:'MATCHS'},
          {id:'standings',icon:'🏆',label:'Classement'},
          {id:'players',icon:'👥',label:'Joueurs'},
          {id:'history',icon:'📋',label:'Historique'},
          {id:'settings',icon:'⚙️',label:'Réglages'}
        ].map(t=>h('button',{key:t.id,className:'tab '+(tab===t.id?'active':''),onClick:()=>setTab(t.id)},
          h('span',{className:'tab-icon'},t.icon),
          h('span',null,t.label)
        ))
      ),
      numPad&&h(NumPad,{
        value:numPad.value,
        label:numPad.label,
        onChange:v=>setScore(numPad.roundId,numPad.matchId,numPad.team,v),
        onClose:()=>setNumPad(null)
      }),
      editingMatch&&h(EditMatchModal,{
        match:editingMatch.match,
        pName,
        onSave:(s1,s2)=>saveMatchScore(editingMatch.roundId,editingMatch.match.id,s1,s2),
        onClose:()=>setEditingMatch(null)
      })
    );
  }

  return h('div',{style:{padding:20,color:'var(--gray)'}},'Chargement...');
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
